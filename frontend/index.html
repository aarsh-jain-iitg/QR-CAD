<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src http://127.0.0.1:5000; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';">
    <title>QRCAD – CAD Retrieval Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div class="app-container">

        <!-- TOP NAVIGATION BAR -->
        <header class="topbar">
            <div class="topbar-left">
                <div class="logo-brand">
                    <div class="logo-text">QRCAD</div>
                    <div class="logo-subtitle">CAD Retrieval Platform</div>
                </div>
            </div>

            <div class="topbar-right">
                <div class="cache-status-badge missing" id="cacheStatusBadge">
                    <span class="status-dot"></span>
                    <span id="cacheStatusText">No Cache</span>
                </div>

                <button class="topbar-icon-btn" id="settingsBtn" title="Settings">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>

                <button class="topbar-icon-btn" id="helpBtn" title="Help">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <path d="M12 17h.01"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- MAIN LAYOUT -->
        <div class="main-layout">

            <!-- LEFT SIDEBAR -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-content">
                    <button class="sidebar-nav-item active" data-view="dashboard" title="Dashboard">
                        <span class="sidebar-nav-icon">
                            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="7" height="9" rx="1"></rect>
                                <rect x="14" y="3" width="7" height="5" rx="1"></rect>
                                <rect x="14" y="12" width="7" height="9" rx="1"></rect>
                                <rect x="3" y="16" width="7" height="5" rx="1"></rect>
                            </svg>
                        </span>
                        <span class="sidebar-nav-label">Home</span>
                    </button>

                    <button class="sidebar-nav-item" data-view="database-manager" title="Databases">
                        <span class="sidebar-nav-icon">
                            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                                <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"></path>
                                <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"></path>
                            </svg>
                        </span>
                        <span class="sidebar-nav-label">Database</span>
                    </button>

                    <button class="sidebar-nav-item" data-view="query-search" title="Single Search">
                        <span class="sidebar-nav-icon">
                            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.3-4.3"></path>
                            </svg>
                        </span>
                        <span class="sidebar-nav-label">Search</span>
                    </button>

                    <button class="sidebar-nav-item" data-view="batch-search" title="Batch Search">
                        <span class="sidebar-nav-icon">
                            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                                <line x1="12" y1="22.08" x2="12" y2="12"></line>
                            </svg>
                        </span>
                        <span class="sidebar-nav-label">Batch</span>
                    </button>

                    <button class="sidebar-nav-item" data-view="search-history" title="History">
                        <span class="sidebar-nav-icon">
                            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                <path d="M3 3v5h5"></path>
                                <path d="M12 7v5l4 2"></path>
                            </svg>
                        </span>
                        <span class="sidebar-nav-label">History</span>
                    </button>
                </div>
            </aside>

            <!-- MAIN WORKSPACE -->
            <main class="workspace" id="workspace">
                <div id="viewContainer"></div>
            </main>
        </div>
    </div>

    <!-- Info Panel Drawer (outside main layout for overlay) -->
    <div class="info-panel-overlay" id="infoPanelOverlay"></div>
    <aside class="info-panel hidden" id="infoPanel">
        <div class="info-panel-header">
            <div class="info-panel-title">Model Details</div>
            <button id="closeInfoPanel" class="info-panel-close" title="Close details" aria-label="Close">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M18 6 6 18M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div class="info-panel-content" id="infoPanelContent">
            <div class="metadata-empty">
                <div class="metadata-empty-text">No details to display</div>
            </div>
        </div>
    </aside>

    <div class="toast-container" id="toastContainer"></div>

    <script type="module" src="js/main-app.js"></script>
</body>
</html>
